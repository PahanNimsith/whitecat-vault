<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White Cat Vault – Offline</title>
<link rel="icon" type="image/png" href="/assets/icons/favicon-32.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a0e;color:#eaeaea;font-family:'Syne',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
.icon{font-size:64px;margin-bottom:1.5rem;filter:drop-shadow(0 0 24px rgba(232,197,90,.4))}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,8vw,80px);background:linear-gradient(140deg,#eaeaea 0%,#f0d06a 45%,#e8c55a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.05em;line-height:.9;margin-bottom:1rem}
p{color:#6a7290;font-size:15px;max-width:360px;margin:0 auto 2rem;line-height:1.7}
a{display:inline-block;background:#e8c55a;color:#080a0e;padding:12px 28px;border-radius:100px;font-weight:700;font-size:12px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;transition:all .2s}
a:hover{background:#f0d06a;transform:translateY(-2px)}
</style>
</head>
<body>
<div>
  <div class="icon">🐈</div>
  <h1>YOU'RE<br>OFFLINE</h1>
  <p>White Cat Vault needs a connection right now. Check your network and try again.</p>
  <a href="/">Try Again →</a>
</div>
</body>
</html>
